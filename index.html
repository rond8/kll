<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLL EDUCATIONAL SITE</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="bg-kll-maroon sticky-top nav-container">
        <div class="nav-brand">
            <img src="asset/img/schoolicon.jpg" alt="Logo" class="school-icon">
            <span>Kolehiyo ng Lungsod ng Lipa</span>
        </div>
        </nav>

    <div class="slideshow-wrapper">
        <div class="slides-container" id="slide-inner">
            <div class="mySlides"><img src="asset/img/index.jpg" alt="Slide 1"></div>
            <div class="mySlides"><img src="asset/img/studentportal.jpg" alt="Slide 2"></div>
            <div class="mySlides"><img src="asset/img/elibrary.jpg" alt="Slide 3"></div>
        </div>
    </div>

    <main style="padding: 40px 5%;">
        <div style="text-align: center;">
            <h1 style="font-size: 3rem; margin-bottom: 20px;">THIS IS KLL</h1>
            
            <section class="logo-body-wrapper">
                <div class="parent-logo">
                    <div class="k-stem d-box straight"><div class="text-inner">KLL</div></div>
                    <div class="k-top d-box slant-left"><div class="text-inner">E</div></div>
                    <div class="k-bot d-box slant-right"><div class="text-inner">PRIDE</div></div>
                    <div class="l1-stem d-box straight"><div class="text-inner">LIPA</div></div>
                    <div class="l1-base d-box base"><div class="text-inner">CITY</div></div>
                    <div class="l2-stem d-box straight"><div class="text-inner">EST.</div></div>
                    <div class="l2-base d-box base"><div class="text-inner">1994</div></div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // Automatic Slideshow Logic
        let currentIdx = 0;
        const slides = document.querySelectorAll('.mySlides');
        const slideInner = document.getElementById('slide-inner');

        function nextSlide() {
            currentIdx = (currentIdx + 1) % slides.length;
            slideInner.style.transform = `translateX(-${currentIdx * 100}%)`;
        }

        setInterval(nextSlide, 5000); // Change image every 5 seconds
    </script>
    
    <script src="navbar.js"></script>
    <script src="logoHover.js"></script>
</body>
</html>
