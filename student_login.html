<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLL Student Portal</title>
</head>

<body>
    <div id="navbar"></div>
    
    <header class="w-full bg-gray-200 border-b-4 border-yellow-500">
        <div class="w-full h-64 md:h-96 bg-gray-300 flex items-center justify-center text-gray-500 italic text-xl shadow-inner overflow-hidden">
            <img src="asset/img/studentportal.jpg" alt="Student Portal" class="w-full h-full object-contain" onerror="this.style.display='none'; this.parentNode.innerHTML='[Student Portal Banner]'">
        </div>
    </header>

    <!-- Main Portal Wrapper -->
    <main class="portal-container" style="padding: 20px; max-width: 800px; margin: 0 auto;">
        
        <!-- 1. LOGIN SECTION (Will be completely hidden on successful authentication) -->
        <div id="login" class="login-card">
            <div class="login-header">
                <div class="portal-badge">KLL</div>
                <h3>Student Login</h3>
                <p>Access your grades and schedules</p>
            </div>

            <div class="input-wrapper">
                <label for="username">Student Number</label>
                <input type="text" id="username" placeholder="Enter your ID number">
            </div>

            <div class="input-wrapper">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <button class="login-btn" onclick="login()">Login to Portal</button>
            
            <div class="login-help">
                <a href="#">Forgot Password?</a>
                <span>•</span>
                <a href="#">Contact Registrar</a>
            </div>
        </div>

        <!-- 2. DATA DISPLAY SECTION (Lives independently so it remains visible) -->
        <div id="result" style="margin-top: 20px;"></div>

    </main>

    <!-- Script loading tags -->
    <script src="student.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
