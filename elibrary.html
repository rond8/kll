<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School E-Library</title>
     <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<header>
     <div id="navbar"></div>
    <nav class="bg-kll-maroon text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white rounded-md flex items-center justify-center text-kll-maroon font-bold text-xs shadow-inner overflow-hidden">
                        <img src="asset/img/schoolicon.jpg" onclick="window.location.href='/index.html';" alt="KLL Logo" class="w-full h-full object-cover">
                    </div>
                    <span class="font-bold text-lg sm:text-xl tracking-wide">Kolehiyo ng Lungsod ng Lipa</span>
                </div>
            </div>
        </div>
    </nav>
    <div class="navbar-library">
        <h1>KLL E-Library</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search by title or author...">
        </div>
    </div>
</header>

<marquee behavior="" direction="">UNDER DEVELOPMENT</marquee>
<div class="container">
    <div class="filter-wrapper">
        <button class="filter-btn active" onclick="filterCategory('All')">All</button>
        <button class="filter-btn" onclick="filterCategory('Computer Science')">CS</button>
        <button class="filter-btn" onclick="filterCategory('Web Development')">Web Dev</button>
        <button class="filter-btn" onclick="filterCategory('Programming')">Programming</button>
    </div>

</div>

<script src="elibrary.js"></script>
    
</body>
</html>
