<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School E-Library</title>
     <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
   :root {
    --primary: #2c3e50;
    --accent: #3498db;
    --bg: #f4f7f6;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    margin: 0;
}

.navbar-library {
    background: var(--primary);
    color: white;
    padding: 1rem 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.search-container input {
    padding: 10px 15px;
    border-radius: 20px;
    border: none;
    width: 280px;
}

.container { padding: 20px 5%; }

.filter-wrapper {
    margin-bottom: 25px;
    display: flex;
    gap: 10px;
}

.filter-btn {
    padding: 8px 18px;
    border: none;
    background: #fff;
    border: 1px solid #ddd;
    cursor: pointer;
    border-radius: 5px;
}

.filter-btn.active, .filter-btn:hover {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}

.library-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
}

.book-card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border-top: 5px solid var(--accent);
}

.book-card h3 { margin-top: 0; color: var(--primary); }

.status-badge {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 15px;
    font-size: 0.8rem;
    font-weight: bold;
    margin-top: 10px;
}

.status-available { background: #e8f5e9; color: #2e7d32; }
.status-borrowed { background: #ffebee; color: #c62828; }
</style>
<body>

<header>
     <div id="navbar"></div>
    <nav class="bg-kll-maroon text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white rounded-md flex items-center justify-center text-kll-maroon font-bold text-xs shadow-inner overflow-hidden">
                        <img src="asset/img/schoolicon.jpg" onclick="window.location.href='/index.html';" alt="KLL Logo" class="w-full h-full object-cover">
                    </div>
                    <span class="font-bold text-lg sm:text-xl tracking-wide">Kolehiyo ng Lungsod ng Lipa</span>
                </div>
            </div>
        </div>
    </nav>
    <div class="navbar-library">
        <h1>KLL E-Library</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search by title or author...">
        </div>
    </div>
</header>

<marquee behavior="" direction="">UNDER DEVELOPMENT</marquee>
<div class="container">
    <div class="filter-wrapper">
        <button class="filter-btn active" onclick="filterCategory('All')">All</button>
        <button class="filter-btn" onclick="filterCategory('Computer Science')">CS</button>
        <button class="filter-btn" onclick="filterCategory('Web Development')">Web Dev</button>
        <button class="filter-btn" onclick="filterCategory('Programming')">Programming</button>
    </div>

</div>

<script src="elibrary.js"></script>
    
</body>
</html>
